name: TeamDarkCore rebrand and verify
on:
  workflow_dispatch:
  push:
    branches: [TDCore]
    paths:
      - 'tools/teamdarkcore_rebrand.py'
      - 'tools/tdcore_migrate_legacy_packages.py'
      - '.github/workflows/teamdarkcore-rebrand.yml'
      - 'TeamDarkCore/src/main/java/**'
      - 'TeamDarkCore/src/main/cpp/**'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: TDCore
          fetch-depth: 0
      - name: Apply coordinated project renames
        run: python3 tools/teamdarkcore_rebrand.py
      - name: Migrate SBox and FBox source packages
        run: python3 tools/tdcore_migrate_legacy_packages.py
      - name: Detect unresolved old project identifiers
        run: |
          if grep -RIlE 'com[./]featurestic[./]box|FeaturesticBox|FeaturesticLoader' TeamDarkCore --include='*.java' --include='*.aidl' --include='*.xml' --include='*.gradle' --include='*.cpp' --include='*.h'; then
            echo 'Unresolved identifiers remain' >&2
            exit 1
          fi
      - name: Commit renamed source before build validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "refactor: rebrand SDK sources as TeamDarkCore"
            git push origin HEAD:TDCore
          fi
      - name: Audit legacy package paths
        run: |
          if find TeamDarkCore/src/main/java/com -type d \( -name sbox -o -name fbox \) | grep .; then
            echo 'Legacy source directory remains' >&2
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Assemble renamed AAR
        run: chmod +x gradlew && ./gradlew :TeamDarkCore:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: TeamDarkCore-release-aar
          path: TeamDarkCore/build/outputs/aar/TeamDarkCore-release.aar
