name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  MODULE: FeaturesticBox
  AAR_PATH: FeaturesticBox/build/outputs/aar/FeaturesticBox-release.aar

jobs:
  build:
    name: Build release AAR
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          key: ndk-27.2.12479018-${{ runner.os }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.2.12479018
          log-accepted-android-sdk-licenses: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build FeaturesticBox release AAR
        run: ./gradlew :${{ env.MODULE }}:assembleRelease --no-daemon --stacktrace

      - name: Show AAR info
        run: |
          ls -lh "$AAR_PATH"
          unzip -l "$AAR_PATH" | head -30

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeaturesticBox-release-aar
          path: |
            ${{ env.AAR_PATH }}
            FeaturesticBox/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach AAR to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built AAR
        uses: actions/download-artifact@v4
        with:
          name: FeaturesticBox-release-aar
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FeaturesticBox-release.aar
          generate_release_notes: true
